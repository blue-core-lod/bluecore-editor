# The editor at /editor/, as Vite builds it (base /editor/). bluecore-stack's
# Nginx passes the prefix through unchanged.
server {
  listen 80;
  # Relative, so a redirect keeps whatever host and port the browser used.
  absolute_redirect off;
  root /usr/share/nginx/html;

  location = /editor {
    return 301 /editor/;
  }

  # Built assets have content hashes in their names, so they never change.
  location /editor/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The app reads which record is open from the query string, so every page is index.html; revalidate it so a new
  # deploy is picked up.
  location /editor/ {
    try_files $uri /editor/index.html;
    add_header Cache-Control "no-cache";
  }

  location = /editor/health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
